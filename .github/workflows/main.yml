name: Science News Bot

on:
  schedule:
    # 한국 시간 기준 매일 아침 08:00에 실행 (UTC 기준 23:00)
    - cron: '47 22 * * *'
  workflow_dispatch: # 필요할 때 수동으로 바로 실행할 수 있는 버튼 생성

jobs:
  run-bot:
    runs-on: ubuntu-latest # 가상의 리눅스 컴퓨터를 빌림
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 코드 실행
        env: # 4단계에서 저장한 비밀 금고를 불러옴
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py
